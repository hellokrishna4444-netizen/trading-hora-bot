name: Daily Hora Auto Updater

on:
  schedule:
    # Roz subah 06:00 AM IST (00:30 AM UTC) par auto-execution
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync-hora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install astral pytz requests

      - name: Execute Hora Script
        env:
          HORA_WEBHOOK_URL: ${{ secrets.HORA_WEBHOOK_URL }}
        run: |
          python hora_sheets_updater.py
